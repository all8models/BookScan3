name: BookScan3
options:
  bundleIdPrefix: com.bookscan
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  BookScan3:
    type: application
    platform: iOS
    sources: [BookScan3]
    info:
      path: BookScan3/Resources/Info.plist
      properties:
        CFBundleDisplayName: BookScan3
        NSCameraUsageDescription: 책 페이지를 촬영하고 문서 영역을 인식하기 위해 카메라를 사용합니다.
        NSLocalNetworkUsageDescription: 전송 화면을 연 동안 같은 Wi-Fi의 PC에 선택한 PDF를 공유합니다.
        NSBonjourServices: ['_http._tcp.']
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookscan.BookScan3
        DEVELOPMENT_TEAM: B9SZKSZ334
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
  BookScan3Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [BookScan3Tests]
    dependencies:
      - target: BookScan3
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BookScan3UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BookScan3UITests]
    dependencies:
      - target: BookScan3
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BookScan3:
    build:
      targets:
        BookScan3: all
    test:
      targets: [BookScan3Tests, BookScan3UITests]
